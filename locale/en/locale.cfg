[mod-setting-description]
dynamic_platform_brightness=Sets how bright a platform can get. 100 means the platform is as bright as the sunniest planet, 25 makes every planet a quarter as bright.
dynamic_platform_always_dark=Ignores the amount of solar power and keeps platforms always dark.
dynamic_platform_lut=Chooses the platform colors used by every orbit. Default (Dynamic) keeps the colours of the planet the platform is orbiting.
dynamic_platform_solar_limit=Caps the solar power in space used to scale brightness. Without a cap, a single extremely bright planet or orbit (for example Moshine, with 60000 solar power in space) sets the scale for every platform and makes all the other platforms very dark.\nSolar power above the limit counts as the limit, so every body at or above it gets full brightness. With a limit of 600, Vulcanus (600 solar power in space) is the brightest body and Moshine is exactly as bright as Vulcanus.\n[font=default-bold]This is visual only: it does not change the real solar power in space of any planet or orbit, so solar panels are not affected.\n0 disables the limit.[/font]
dynamic_platform_max_dark_lut=Adds a extremely dark color palette on the orbit where solar power in space is 0 or close to 0
dynamic_platform_solar_min=Solar power in space below this value counts as this value, so the darkest end of the scale starts at this value instead of 0. Default 60 matches Aquilo, the darkest planet. 0 disables the minimum.. 

