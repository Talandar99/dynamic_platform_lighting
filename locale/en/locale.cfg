[mod-setting-name]
dynamic_platform_brightness=Brightness
dynamic_platform_always_dark=Always dark
dynamic_platform_lut=Day/night colours

[mod-setting-description]
dynamic_platform_brightness=Sets how bright a platform can get. 100 means the platform is as bright as the sunniest planet, 25 makes every planet a quarter as bright.
dynamic_platform_always_dark=Ignores the amount of solar power and keeps the platform at the middle of the night.
dynamic_platform_lut=Chooses the day/night colours used by every orbit. Default (Dynamic) keeps the colours of the planet the platform is orbiting.

